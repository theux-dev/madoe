name: Build and test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Só leitura do repositório: o workflow não precisa de nenhuma outra permissão.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Usa a versão do Gradle definida em gradle/wrapper/gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v6

      - name: Instalar plataforma e build-tools do Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Garante o bit de execução mesmo se ele se perder ao subir os arquivos.
      - name: Permitir execução do Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Testes de unidade
        run: ./gradlew testDebugUnitTest --no-daemon

      # O lint olha o código e os recursos (acessibilidade, API inexistente no Android 8, textos sem
      # tradução etc.). Só erros quebram o build; os avisos ficam no relatório.
      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Guardar o relatório do lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Compilar (debug)
        run: ./gradlew assembleDebug --no-daemon

      # O release liga o R8 (ofuscação e remoção de código) e a redução de recursos, que o build de debug
      # não exercita. Sai sem assinatura, e nenhum APK é publicado.
      - name: Compilar (release)
        run: ./gradlew assembleRelease --no-daemon

      - name: Comparar o tamanho dos APKs
        run: ls -l app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      # Se o R8 reclamar de classes ausentes, o missing_rules.txt traz as regras sugeridas.
      - name: Guardar os relatórios do R8
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-release
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 14
